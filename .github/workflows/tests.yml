name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install NPM dependencies & build aset
        run: |
          npm ci
          npm run build

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan test
        id: test-suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          php artisan test --compact 2>&1 | tee storage/logs/ci-tests.log

      - name: Tampilkan ringkasan error test
        if: steps.test-suite.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          output = Path('storage/logs/ci-tests.log').read_text(errors='replace')[-3500:]
          escaped = output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Output PHPUnit (3500 karakter terakhir)::{escaped}')
          PY

      - name: Unggah log test jika gagal
        if: steps.test-suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs
          path: |
            storage/logs/ci-tests.log
            storage/logs/laravel.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Gagalkan workflow jika test gagal
        if: steps.test-suite.outcome == 'failure'
        run: exit 1
